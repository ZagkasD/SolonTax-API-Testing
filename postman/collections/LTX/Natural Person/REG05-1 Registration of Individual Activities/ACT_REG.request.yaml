$kind: http-request
description: |-
  TIN is computed at runtime by a pre-request script. It extracts the third string of the variable fullName. My parties always have the same format: Dimos x y Zagkas, where x = source of information (eg. GR) and y a random 8 lower char string.

  startDate is computed at runtime by a pre-request script. It is set to current date + 1. If the manualStartDate variable is enabled in the environment level and set to not null, then it will overwrite the startDate.
url: "{{form-submission}}"
method: POST
body:
  type: json
  content: "{\r

    \        \"party\": {\r

    \            \"id\": \"{{partyId}}\"\r

    \        },\r

    \        \"formTypeCode\": \"ACT_REG\",\r

    \        \"sourceCL\": \"3\",\r

    \        \"sourceCLDescription\": \"MAP\",\r

    \        \"receiveDate\": \"{{currentDate}}\",   \r

    \        \"filingTypeCL\": \"ORIGINAL\",\r

    \        \"filingTypeCLDescription\": \"Original\",\r

    \        \"formData\": \"{\\\"isCreate\\\":true,\\\"isMinor\\\":false,\\\"partyId\\\":\\\"{{partyId}}\\\",\\\"taxPayerType\\\":\\\"{{mmType}}\\\",\\\"naturalPersonData\\\":{\\\"identificationCode\\\":\\\"Taxpayer identification number: {{TIN}}\\\",\\\"fullName\\\":\\\"{{fullName}}\\\",\\\"address\\\":{\\\"id\\\":\\\"{{addressId}}\\\"}},\\\"mainActivityData\\\":[{\\\"confirmCompliance\\\":false,\\\"startDate\\\":\\\"{{startDate}}\\\",\\\"activityCategoryCL\\\":7110,\\\"mainActivityType\\\":\\\"{{mainActivityType}}\\\",\\\"mainActivityDescription\\\":\\\"{{mainActivityDescription}}\\\",\\\"taxPayerTypeSelection\\\":\\\"{{mmType}}\\\"}],\\\"otherActivityData\\\":[{\\\"startDate\\\":\\\"{{startDate}}\\\",\\\"confirmCompliance\\\":false,\\\"otherActivityType\\\":\\\"{{otherActivityType}}\\\",\\\"activityCategoryCL\\\":7110,\\\"otherActivityDescription\\\":\\\"{{otherActivityDescription}}\\\",\\\"defaultStartDatePopulatedIRM\\\":\\\"UNPOPULATED\\\"}],\\\"placeOfActivityData\\\":[{\\\"coincides\\\":true,\\\"address\\\":{\\\"countryCodeCL\\\":\\\"LT\\\",\\\"addressOptionCL\\\":\\\"STRUCTURED\\\",\\\"addressTypeCL\\\":\\\"43\\\",\\\"houseNumberStatus\\\":\\\"DISABLED\\\",\\\"creationDttm\\\":\\\"{{startDate}}\\\",\\\"sourceCL\\\":\\\"3\\\"},\\\"startDate\\\":\\\"{{startDate}}\\\",\\\"typeOfPlace\\\":\\\"99\\\",\\\"residenceAddress\\\":{\\\"id\\\":\\\"{{addressId}}\\\"}}]}\"\r

    \    }"
scripts:
  - type: beforeRequest
    code: "// Extract TIN from fullName\r

      const fullName = (pm.variables.get(\"fullName\") || \"\").trim();\r

      // format: Dimos GR <TIN> Zagkas  -> TIN is the 3rd token\r

      const parts = fullName.split(/\\s+/);\r

      const tin = parts.length >= 3 ? parts[2] : \"\";\r

      pm.variables.set(\"TIN\", tin);\r

      \r

      // Check if a manual override is set in the environment or collection\r

      const manualStartDate = pm.variables.get(\"manualStartDate\");\r

      \r

      if (manualStartDate) {\r

      \    // If a manual date is provided, use it\r

      \    pm.variables.set(\"startDate\", manualStartDate);\r

      } else {\r

      \    // Otherwise, default to current date + 1\r

      \    const date = new Date();\r

      \    date.setDate(date.getDate() + 1);\r

      \    pm.variables.set(\"startDate\", date.toISOString().split('T')[0]);\r

      }"
    language: text/javascript
order: 2000
