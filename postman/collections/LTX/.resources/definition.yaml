$kind: collection
scripts:
  - type: http:beforeRequest
    code: |-
      // Set currentDatePlusOne variable for the whole collection
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate() + 1).padStart(2, '0'); //currentDate + 1
      pm.environment.set('currentDatePlusOne', `${yyyy}-${mm}-${dd}`);
    language: text/javascript
